name: Update README card

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stats-card.yml"
      - "scripts/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # `secrets` isn't available in a step-level `if`, so surface it as env first.
    env:
      STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        if: env.STATS_TOKEN != ''
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=Bownlux&theme=dark&count_private=true&show_icons=true&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Explain the skipped stats card
        if: env.STATS_TOKEN == ''
        run: |
          echo "::warning title=Stats card skipped::No STATS_TOKEN secret set, so profile/stats.svg was not generated. GITHUB_TOKEN is scoped to this repo and cannot read stargazers across repos, which is what the card needs. Add a PAT with public_repo + read:user as STATS_TOKEN."

      - name: Generate issues-solved card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/issues-solved.sh Bownlux profile/issues-solved.svg

      - name: Bust image cache in README
        run: |
          TS=$(date +%s)
          sed -i -E "s|stats\.svg\?v=[0-9]+|stats.svg?v=${TS}|g" README.md
          sed -i -E "s|issues-solved\.svg\?v=[0-9]+|issues-solved.svg?v=${TS}|g" README.md

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A profile README.md
          git diff --cached --quiet || git commit -m "Update README card"
          git push
